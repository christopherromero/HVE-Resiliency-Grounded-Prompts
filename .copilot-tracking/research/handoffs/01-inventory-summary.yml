unresolved_items:
  - id: UNC-001
    area: azure_sql_connectivity
    summary: Production datasource URL comes from SQL_CONNECTION_STRING, so failover group read-write listener usage cannot be validated from the repository.
    resolution_source: external_evidence_required
  - id: UNC-002
    area: kafka_deployed_topology
    summary: Deployed Kafka cluster topology, cluster linking, and offset replication are not determinable from the repository.
    resolution_source: external_evidence_required
  - id: UNC-003
    area: kafka_security_protocol
    summary: Production Kafka security.protocol defaults to PLAINTEXT when KAFKA_SECURITY_PROTOCOL is unset.
    resolution_source: repository_observed_with_deployment_confirmation_required
  - id: UNC-004
    area: regional_processing_ownership
    summary: The @KafkaListener has no id or autoStartup control, so per-region consumption enablement cannot be validated.
    resolution_source: repository_observed_gap_plus_deployment_confirmation
  - id: UNC-005
    area: apim_capability_expectation
    summary: APIM declared required in context but no outbound HTTP behavior exists to validate.
    resolution_source: architecture_clarification_required
  - id: UNC-006
    area: runtime_and_container_configuration
    summary: JVM options, container entrypoint, probes, resource limits, and termination grace live in disabled domains.
    resolution_source: scope_limited
  - id: UNC-007
    area: aks_istio_capability_expectation
    summary: Kubernetes manifests exist but the deployment_configuration domain is disabled.
    resolution_source: scope_limited
  - id: UNC-008
    area: schema_governance
    summary: Events use untyped Map payloads with spring.json.trusted.packages set to '*' and no schema registry configuration.
    resolution_source: architecture_clarification_required
  - id: UNC-009
    area: redis_operating_model
    summary: Approved Redis target is active_active but the repository supplies a single connection string with no region awareness.
    resolution_source: external_evidence_required

