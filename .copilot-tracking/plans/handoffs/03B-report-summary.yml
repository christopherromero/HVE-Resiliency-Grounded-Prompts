key_decisions:
  - id: KD-R-001
    decision: >-
      Display identifiers were derived deterministically from the complete authoritative finding set as
      priority plus sequence within priority, ordered by Step 2 finding identifier. The map is frozen and
      recorded in this handoff and in the report manifest so Step 4 and Step 5 can resolve any display
      identifier without recomputation.
  - id: KD-R-002
    decision: >-
      Sections 1 through 7 carry display identifiers only. Every Step 2 finding identifier, Step 3A change
      identifier, control identifier, evidence identifier, priority rule identifier, proposed test
      identifier, open question, evidence gap, and targeted-discovery identifier is resolved in Appendix A,
      so suppression is presentation-only and no traceability is lost.
  - id: KD-R-003
    decision: >-
      Findings that share one remediation change render that change's illustrative code exactly once under
      the lowest display identifier in the group. The remaining findings in the group render the verbatim
      contiguous portion of the shared proposal that pertains to them and cross-reference the full proposal
      by display identifier. No code was invented, reordered, or duplicated.
  - id: KD-R-004
    decision: >-
      P0-009 is remediated entirely by test source. Because the configured testing-output preference is
      hidden with test code suppressed, its proposed implementation is rendered as prose with an explicit
      suppression statement. The finding, its priority, and its binding validation obligations are
      unchanged.
  - id: KD-R-005
    decision: >-
      The Standards Alignment section names control areas descriptively rather than by control identifier,
      because control identifiers are suppressed from sections 1 through 7. Primary control identifiers for
      every finding are preserved in Appendix A.
  - id: KD-R-006
    decision: >-
      Six reference-architecture entries were rendered because their applicable_when conditions matched a
      Step 1 confirmed dependency or the confirmed runtime platform. Document status is rendered alongside
      approval status so a proposal or document library is not presented as a final approved design.
  - id: KD-R-007
    decision: >-
      The report was assembled incrementally against frozen scope, with one complete finding written at a
      time and stable invisible markers before each section and finding. The completed file was reopened
      and validated, and the template validator returned PASSED.

