key_decisions:
  - id: KD-P-001
    decision: >-
      Twenty-nine findings were consolidated into 24 root-cause changes. Five findings were consolidated
      under another change because they share one implementation surface: F-006 with F-005, F-010 and
      F-011 with F-009, and F-017 and F-018 with F-029. No finding was dropped or reclassified.
  - id: KD-P-002
    decision: >-
      Priority was assigned exclusively through AA-REMEDIATION-PRIORITY 1.0.0 by selecting the highest
      applicable rule. Severity was never used as a priority source, which produced three deliberate
      divergences: F-026 at P0 despite medium severity, and F-002 and F-020 at P2 despite critical
      severity.
  - id: KD-P-003
    decision: >-
      Seven P2 candidates were evaluated for P0 elevation and none were elevated. Each evaluation and its
      rationale is recorded on the change.
  - id: KD-P-004
    decision: >-
      Waves are dependency-ordered, not priority-ordered. CHANGE-AA-024 is P0 but sits in Wave 4 because
      the consolidated regression suite depends on every other change; per-change tests land in their own
      waves.
  - id: KD-P-005
    decision: >-
      Six targets that change externally observable behaviour were isolated inside their changes and held
      at implementation_allowed false pending approval, so the surrounding resiliency mechanisms are not
      blocked.
  - id: KD-P-006
    decision: >-
      Three targets were marked targeted_discovery_required. In every case the surrounding change still
      delivers concrete code for its unblocked targets, so no change is entirely discovery-required.
  - id: KD-P-007
    decision: >-
      Both new tables proposed by the plan, the processed-operation deduplication table and the outbox
      table, reside in the Azure SQL authoritative store the approved architecture already declares. No
      new datastore is introduced and the Kafka operating scenario was not redesigned.
  - id: KD-P-008
    decision: >-
      Every numeric budget, threshold, window, TTL, and page size is expressed as an externalized
      placeholder because no approved value exists in the supplied context and EG-006 leaves the gateway
      budgets unresolved.
  - id: KD-P-009
    decision: >-
      Evidence gaps EG-001 through EG-011 and control coverage gaps CCG-001 through CCG-004 were carried
      forward unchanged and were not converted into remediation work.

