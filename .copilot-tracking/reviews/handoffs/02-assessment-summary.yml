key_decisions:
  - id: KD-A-001
    decision: >-
      Kafka scenario provenance, assessment scope, architecture context, and snapshot classification were
      carried from Step 1 without recalculation, in accordance with the no-re-inventory rule.
  - id: KD-A-002
    decision: >-
      Only the six dependency standards listed under Dependency Standards to Load, plus the master
      standard and the PCF exclusion, were loaded. No substitute standard was loaded for any disabled
      assessment domain.
  - id: KD-A-003
    decision: >-
      Findings were deduplicated by root cause. Health and readiness defaults were consolidated into
      F-008, region-role activation into F-004, and all fault and failover testing gaps into F-028, with
      the contributing controls recorded as related controls rather than as separate findings.
  - id: KD-A-004
    decision: >-
      Controls whose evaluation requires deployed topology, container build artifacts, or externally
      supplied connection-string values were marked not_assessed and recorded as evidence gaps rather
      than converted into code findings.
  - id: KD-A-005
    decision: >-
      Three evidence-backed control violations were classified non_resiliency because they manifest during
      normal operation with no dependency failure or recovery event involved. They are preserved, not
      suppressed, in accordance with the qualification policy.
  - id: KD-A-006
    decision: >-
      Four repository-evidenced risks with no applicable loaded control were recorded as control coverage
      gaps CCG-001 through CCG-004 and routed to grounding standard governance rather than being forced
      into an unrelated control.
  - id: KD-A-007
    decision: >-
      Targeted evidence validation opened only files and ranges already cited by the inventory. One
      citation line-range overshoot was corrected and recorded as inventory exception EXC-A-001.

