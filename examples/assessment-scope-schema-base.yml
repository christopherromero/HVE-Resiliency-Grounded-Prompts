---
schema_version: "1.0.0"
document_type: assessment_scope_schema
schema_id: ASSESSMENT-SCOPE-CONTEXT
lifecycle_status: active
owner: Cloud Architecture Team
---
allowed_domains:
  application_code: [enabled, disabled]
  application_configuration: [enabled, disabled]
  container_build: [enabled, disabled]
  cicd_pipeline: [enabled, disabled]
  deployment_configuration: [enabled, disabled]
  infrastructure_as_code: [disabled, inventory_only, findings_enabled]
  deployed_infrastructure: [disabled]
defaults:
  application_code: enabled
  application_configuration: enabled
  container_build: enabled
  cicd_pipeline: enabled
  deployment_configuration: enabled
  infrastructure_as_code: disabled
  deployed_infrastructure: disabled
allowed_testing_output_modes: [full, summary, roadmap_only, hidden]

report_finding_selection:
  allowed_modes:
    - all_priorities
    - priority_filter
  allowed_priorities:
    - P0
    - P1
    - P2
    - P3
  defaults:
    mode: all_priorities
    include_priorities:
      - P0
      - P1
    include_conditional_findings: true
    include_verified_controls: true
    include_evidence_gaps: true
  validation_rules:
    - include_priorities_must_not_be_empty_for_priority_filter
    - include_priorities_must_be_unique
    - include_priorities_must_use_allowed_values
    - selection_must_not_change_step_2_findings
    - selection_must_not_change_step_3a_priorities
    - filtered_report_must_declare_omitted_priorities
    - filtered_counts_must_reconcile_to_selected_priorities
    - authoritative_total_counts_must_remain_available_in_source_artifacts
  testing_output:
    mode: Full
    show_test_findings: true
    show_test_code: true
    show_validation_commands: true
    show_acceptance_criteria: true
    show_validation_evidence: true
    include_consolidated_validation_strategy: true
