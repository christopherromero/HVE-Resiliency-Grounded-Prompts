activation_signals:
  signal_classes:
    production_code_evidence:
      source: inventory_dependencies
      requires: repository production-code evidence of effective interaction
      evaluation_mode: full
    repository_pattern_evidence:
      source: repository_patterns
      requires: repository-owned file, configuration key, manifest, or build element match
      evaluation_mode: full
    architecture_declared_capability:
      source: inventory_capabilities
      requires: approved architecture context or resolved inventory capability
      evaluation_mode: repository_verifiable_controls_only
  resolution_rule: activate_when_any_is_an_or_across_all_signal_classes
  multi_signal_behavior: record_every_matched_signal_and_use_the_strongest_evaluation_mode
  evaluation_mode_strength_order:
  - full
  - repository_verifiable_controls_only
  unmatched_behavior: standard_not_activated
  declared_only_dependency_behavior: standard_not_activated
  restricted_mode_rules:
  - evaluate_controls_whose_evidence_is_repository_owned
  - mark_integration_dependent_controls_not_assessed
  - never_emit_non_compliant_from_a_declaration_alone
  - record_the_activation_signal_on_every_finding_and_control_status
  - all_not_assessed_is_a_valid_outcome_not_an_assessment_gap
  activation_authority_separation:
    activation_establishes: applicability
    activation_never_establishes: defect
    non_compliant_requires: repository_evidence
registry_rules:
  single_authority: true
  invent_grounding_paths: false
  substitute_missing_standard: false
  missing_entry_behavior: record_dependency_standard_gap
  disabled_domain_behavior: not_applicable
  unknown_ownership_behavior: not_assessed
  duplicate_standard_loading_prohibited: true
  risk_classification_propagates_to_findings: true
shared_service_scope_contract:
  context_path: architecture_context.shared_service_assessment_scope.services
  schema_path: grounding/governance/shared-service-assessment-scope-schema.yml
  control_evaluation_allowed_only_when: in_scope
  architecture_reasoning_allowed_for:
  - in_scope
  - out_of_scope
  - informational_only
  - architecture_only
  scope_conflict_behavior: architecture_governance_review
