# Dependency Standard Registry
schema_version: "2.1"
registry_type: dependency_standard_registry

# Version policy
#   Dependency standards updated with business-logic risk classification are 2.1.0.
#   Standards not yet updated remain at their current version.
#   Every entry declares an explicit standard.path and standard.version.

standards:

  keyvault:
    display_name: Azure Key Vault
    grounding_file: grounding/dependencies/springboot-keyvault.md
    type: dependency_standard
    activate_when_any:
      inventory_dependencies:
        - keyvault
        - azure-keyvault
      repository_patterns:
        - SecretClient
        - CertificateClient
        - KeyClient
        - spring.cloud.azure.keyvault
        - AZURE_KEYVAULT_URI
    standard:
      path: grounding/dependencies/springboot-keyvault.md
      version: "2.0.0"

  cosmosdb:
    display_name: Azure Cosmos DB
    grounding_file: grounding/dependencies/springboot-cosmosdb.md
    type: dependency_standard
    activate_when_any:
      inventory_dependencies:
        - cosmosdb
        - azure-cosmos
      repository_patterns:
        - CosmosClientBuilder
        - CosmosAsyncClient
        - spring.cloud.azure.cosmos
        - ChangeFeedProcessor
    standard:
      path: grounding/dependencies/springboot-cosmosdb.md
      version: "2.1.0"
      business_logic_risk_classification: true

  eventhubs:
    display_name: Azure Event Hubs
    grounding_file: grounding/dependencies/springboot-eventhubs.md
    type: dependency_standard
    activate_when_any:
      inventory_dependencies:
        - eventhubs
        - azure-messaging-eventhubs
      repository_patterns:
        - EventHubProducerClient
        - EventHubClientBuilder
        - EventProcessorClient
        - spring.cloud.azure.eventhubs
        - BlobCheckpointStore
    standard:
      path: grounding/dependencies/springboot-eventhubs.md
      version: "2.1.0"
      business_logic_risk_classification: true

  storage-blob:
    display_name: Azure Blob Storage
    grounding_file: grounding/dependencies/springboot-storage-blob.md
    type: dependency_standard
    activate_when_any:
      inventory_dependencies:
        - storage-blob
        - azure-storage-blob
      repository_patterns:
        - BlobServiceClientBuilder
        - BlobContainerClient
        - BlobClient
        - spring.cloud.azure.storage
    standard:
      path: grounding/dependencies/springboot-storage-blob.md
      version: "2.1.0"
      business_logic_risk_classification: true

  azure-sql:
    display_name: Azure SQL
    grounding_file: grounding/dependencies/springboot-azure-sql.md
    type: dependency_standard
    activate_when_any:
      inventory_dependencies:
        - azure-sql
        - mssql-jdbc
        - r2dbc-mssql
      repository_patterns:
        - jdbc:sqlserver
        - r2dbc:mssql
        - SQLServerDataSource
        - spring.datasource.url
    standard:
      path: grounding/dependencies/springboot-azure-sql.md
      version: "2.0.0"

  postgresql:
    display_name: PostgreSQL
    grounding_file: grounding/dependencies/springboot-postgresql.md
    type: dependency_standard
    activate_when_any:
      inventory_dependencies:
        - postgresql
        - postgres
      repository_patterns:
        - jdbc:postgresql
        - r2dbc:postgresql
        - PGSimpleDataSource
        - spring.datasource.url
        - PGHOST
    standard:
      path: grounding/dependencies/springboot-postgresql.md
      version: "2.1.0"
      business_logic_risk_classification: true

  apim:
    display_name: Azure API Management Client Behavior
    grounding_file: grounding/dependencies/springboot-apim.md
    type: dependency_standard
    activate_when_any:
      inventory_dependencies:
        - apim
        - azure-api-management
      repository_patterns:
        - Ocp-Apim-Subscription-Key
        - azure-api.net
        - WebClient.Builder
        - RestClient.Builder
        - FeignClient
    standard:
      path: grounding/dependencies/springboot-apim.md
      version: "2.1.0"
      business_logic_risk_classification: true

  appgateway-glb:
    display_name: Application Gateway and Global Load Balancer Behavior
    grounding_file: grounding/dependencies/springboot-appgateway-glb.md
    type: dependency_standard
    activate_when_any:
      inventory_capabilities:
        - ingress: application_gateway
        - ingress: global_load_balancer
      repository_patterns:
        - server.forward-headers-strategy
        - ForwardedHeaderFilter
        - X-Forwarded-For
        - actuator/health/readiness
        - actuator/health/liveness
    standard:
      path: grounding/dependencies/springboot-appgateway-glb.md
      version: "2.1.0"
      business_logic_risk_classification: true

  http-client:
    display_name: HTTP Client Behavior
    grounding_file: grounding/dependencies/springboot-http-client.md
    type: cross_cutting_client_standard
    activate_when_any:
      inventory_dependencies:
        - spring-web
        - spring-webflux
        - apache-httpclient
        - okhttp
        - openfeign
      repository_patterns:
        - WebClient
        - RestClient
        - RestTemplate
        - HttpClient
        - FeignClient
    standard:
      path: grounding/dependencies/springboot-http-client.md
      version: "1.0.0"

  confluent-kafka:
    display_name: Confluent Kafka
    grounding_file: grounding/dependencies/springboot-confluent-kafka.md
    type: scenario_aware_dependency_standard
    activate_when_any:
      inventory_dependencies:
        - confluent-kafka
        - spring-kafka
      repository_patterns:
        - KafkaTemplate
        - KafkaListener
        - spring.kafka.bootstrap-servers
        - schema.registry.url
    standard:
      path: grounding/dependencies/springboot-confluent-kafka.md
      version: "2.0.0"
    scenario_policy:
      path: grounding/governance/kafka-operating-scenario-policy.yml
      version: "2.0.0"
    context_sources:
      preferred:
        - application-context/application-architecture-context.yml
      fallback:
        - repository_observed_dependency_roles

  dse-cassandra:
    display_name: DSE Cassandra
    grounding_file: grounding/dependencies/springboot-dse-cassandra.md
    type: scenario_aware_dependency_standard
    activate_when_any:
      inventory_dependencies:
        - dse-cassandra
      repository_patterns:
        - DseSession
        - DseCluster
        - spring.data.cassandra
        - cassandra.contact-points
    standard:
      path: grounding/dependencies/springboot-dse-cassandra.md
      version: "2.0.0"
    scenario_policy:
      path: grounding/governance/dse-cassandra-operating-scenario-policy.yml
      version: "2.0.0"
    context_sources:
      preferred:
        - application-context/application-architecture-context.yml
      fallback:
        - repository_observed_dependency_roles

  azure-managed-redis:
    display_name: Azure Managed Redis
    grounding_file: grounding/dependencies/springboot-azure-managed-redis.md
    type: dependency_standard
    activate_when_any:
      inventory_dependencies:
        - azure-managed-redis
        - redis
      repository_patterns:
        - RedisTemplate
        - ReactiveRedisTemplate
        - RedisCacheManager
        - LettuceConnectionFactory
        - JedisPool
        - RedissonClient
        - spring.data.redis
        - spring.session.store-type=redis
    standard:
      path: grounding/dependencies/springboot-azure-managed-redis.md
      version: "2.0.0"

  aks-istio:
    display_name: Azure AKS with Istio
    grounding_file: grounding/dependencies/springboot-aks-istio.md
    type: dependency_standard
    activate_when_any:
      inventory_capabilities:
        - runtime_platform: aks
        - service_mesh: istio
      repository_patterns:
        - VirtualService
        - DestinationRule
        - ServiceEntry
        - sidecar.istio.io
        - proxy.istio.io
        - istio-injection
    standard:
      path: grounding/dependencies/springboot-aks-istio.md
      version: "2.0.0"

  azure-functions:
    display_name: Azure Function
    grounding_file: grounding/dependencies/springboot-azure-function.md
    type: dependency_standard
    activate_when_any:
      inventory_capabilities:
        - runtime_platform: azure-function
      repository_patterns:
        - host.json
        - function.json
        - FunctionName
        - HttpTrigger
        - TimerTrigger
        - QueueTrigger
        - ServiceBusTrigger
        - EventHubTrigger
        - BlobTrigger
        - DurableOrchestrationContext
    standard:
      path: grounding/dependencies/springboot-azure-function.md
      version: "2.0.0"

  jvm-runtime:
    display_name: JVM Runtime Resiliency
    grounding_file: grounding/dependencies/jvm-runtime-resiliency.md
    type: dependency_standard
    activate_when_any:
      inventory_capabilities:
        - runtime: jvm
        - language: java
        - framework: spring-boot
      repository_patterns:
        - pom.xml
        - build.gradle
        - build.gradle.kts
        - JAVA_TOOL_OPTIONS
        - JAVA_OPTS
        - JDK_JAVA_OPTIONS
        - -Xmx
        - -XX:MaxRAMPercentage
        - spring.threads.virtual.enabled
        - spring.lifecycle.timeout-per-shutdown-phase
    standard:
      path: grounding/dependencies/jvm-runtime-resiliency.md
      version: "1.0.0"

# Optional assessment-domain standards.
# These activate only when the matching domain is enabled in
# application-context/assessment-scope-context.yml and repository-owned
# artifacts are present. They are not runtime application dependencies.

assessment_domain_standards:

  cicd-pipeline-resiliency:
    display_name: CI/CD Pipeline Resiliency
    grounding_file: grounding/dependencies/cicd-pipeline-resiliency.md
    standard_id: CICD-PIPELINE-RESILIENCY
    version: "1.0.0"
    assessment_domain: cicd_pipeline
    activate_when:
      scope_status: enabled
    repository_patterns:
      - .github/workflows/*.yml
      - .github/workflows/*.yaml
      - azure-pipelines.yml
      - azure-pipelines.yaml
      - pipelines/*.yml
      - pipelines/*.yaml

  container-build-resiliency:
    display_name: Container Build Resiliency
    grounding_file: grounding/dependencies/container-build-resiliency.md
    standard_id: CONTAINER-BUILD-RESILIENCY
    version: "1.0.0"
    assessment_domain: container_build
    activate_when:
      scope_status: enabled
    repository_patterns:
      - Dockerfile
      - Dockerfile.*
      - docker/*.Dockerfile
      - container/*.Dockerfile

  kubernetes-deployment-resiliency:
    display_name: Kubernetes Deployment Resiliency
    grounding_file: grounding/dependencies/kubernetes-deployment-resiliency.md
    standard_id: KUBERNETES-DEPLOYMENT-RESILIENCY
    version: "1.0.0"
    assessment_domain: deployment_configuration
    activate_when:
      scope_status: enabled
    repository_patterns:
      - deployment*.yml
      - deployment*.yaml
      - statefulset*.yml
      - statefulset*.yaml
      - service*.yml
      - service*.yaml
      - k8s/**/*.yml
      - k8s/**/*.yaml
      - manifests/**/*.yml
      - manifests/**/*.yaml

  helm-kustomize-resiliency:
    display_name: Helm and Kustomize Resiliency
    grounding_file: grounding/dependencies/helm-kustomize-resiliency.md
    standard_id: HELM-KUSTOMIZE-RESILIENCY
    version: "1.0.0"
    assessment_domain: deployment_configuration
    activate_when:
      scope_status: enabled
    repository_patterns:
      - Chart.yaml
      - values*.yml
      - values*.yaml
      - templates/**/*.yaml
      - kustomization.yml
      - kustomization.yaml
      - overlays/**/*.yml
      - overlays/**/*.yaml

# Registry governance rules.

registry_rules:
  single_authority: true
  invent_grounding_paths: false
  substitute_missing_standard: false
  missing_entry_behavior: record_dependency_standard_gap
  disabled_domain_behavior: not_applicable
  unknown_ownership_behavior: not_assessed
  duplicate_standard_loading_prohibited: true
  risk_classification_propagates_to_findings: true
