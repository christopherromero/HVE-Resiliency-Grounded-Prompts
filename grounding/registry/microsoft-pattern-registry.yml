# Microsoft Resiliency Pattern Registry
#
# Reusable, customer-independent registry of Microsoft Learn guidance cited by
# resiliency assessment reports.
#
# Placement rationale:
#   application-context/reference-architecture-registry.yml holds CUSTOMER-SPECIFIC
#   architecture documents. This registry holds PUBLIC Microsoft guidance that is
#   identical for every customer, so it lives in grounding/registry/ alongside
#   dependency-standard-registry.yml.
#
# Consumed by Prompt 3B via:
#   MICROSOFT_PATTERN_REGISTRY=grounding/registry/microsoft-pattern-registry.yml

document_type: microsoft_pattern_registry
schema_version: 1.0.0
registry_id: MICROSOFT-RESILIENCY-PATTERNS
lifecycle_status: approved
source_authority: Microsoft Learn public documentation
owner: Resiliency Assessment Framework
last_reviewed: 2026-09-29

provenance:
  derived_from: 60 delivered code-level resiliency assessment reports
  extraction_method: Pattern-to-finding-category mapping extracted from 1,222 per-finding citations
  control_mapping_method: 433 distinct grounding control IDs classified into 23 control families
  link_validation: Every URL issued an HTTP HEAD request on 2026-09-29; only HTTP 200 responses were admitted
  excluded_dead_links:
    - url: https://learn.microsoft.com/azure/architecture/patterns/idempotency
      status: 404
      prior_citations: 8
      replaced_by: MSFT-IDEMCONS-001
    - url: https://learn.microsoft.com/azure/architecture/patterns/transactional-outbox
      status: 404
      prior_citations: 8
      replaced_by: MSFT-OUTBOX-001
    - url: https://learn.microsoft.com/azure/architecture/framework/devops/monitor
      status: 404
      prior_citations: 7
      replaced_by: MSFT-OBSERVE-001
    - url: https://learn.microsoft.com/azure/well-architected/reliability/design-checklist
      status: 404
      prior_citations: 6
      replaced_by: MSFT-WAF-CHECKLIST-001

rendering_contract:
  finding_reference:
    render_as: '**MSFT Reference:** [<title>](<url>)'
    placement: Final line of each finding, after Notes
    max_per_finding: 1
    required: false
    omit_when: No registered pattern matches any control cited by the finding
    eligible_usage_values:
      - finding_reference_and_alignment
  standards_alignment:
    report_section: standards_alignment
    heading_owned_by: report schema
    heading_note: The report schema owns the section heading. It is currently Standards Alignment. Do not rename it from this registry.
    columns:
      - order: 1
        name: Pattern
        source_field: title
        render_as: markdown_link
        link_target_field: url
      - order: 2
        name: Status
        source_field: derived
      - order: 3
        name: Findings
        source_field: derived
    status_is_derived: true
    status_derivation: Computed at assessment time from the findings mapped to the pattern. Never stored in this registry.
    status_values:
      - Implemented
      - Partial
      - Not Implemented
      - Misconfigured
      - Not Applicable
    status_requires_reason_for:
      - Partial
      - Misconfigured
    sort_by: precedence
  resolution_order:
    - Discard patterns whose usage is standards_alignment_only.
    - Score each remaining pattern by how many of the finding's cited controls it matches.
      An explicit applies_to_controls match scores higher than an applies_to_control_families match.
    - Select the pattern matching the greatest number of the finding's controls. This prevents a
      single incidental control from outvoting the finding's dominant control family.
    - Break a tie on the lowest precedence value, then on pattern_id for determinism.
    - Omit the reference entirely when no pattern matches.

governance_rules:
  - Cite only URLs present in this registry. Never invent, infer, or substitute a Microsoft URL.
  - Every URL must return HTTP 200 at registry review time. Remove or replace any link that does not.
  - Store locale-neutral URLs. Never emit /en-us/. Microsoft injects the locale server-side.
  - A pattern reference is guidance. It is never repository source evidence for a finding.
  - A finding without a matching pattern renders no MSFT Reference line. Absence is correct and expected.
  - Patterns with usage standards_alignment_only never appear as a per-finding reference.
  - Do not present a pattern status of Implemented without repository evidence.
  - Adding a control to grounding does not require a registry edit when its family is already mapped.

