# Removed 2026-09-29: six general-guidance patterns carrying usage standards_alignment_only
# (MSFT-WAF-PRINCIPLES-001, MSFT-WAF-CHECKLIST-001, MSFT-WAF-RELIABILITY-001, MSFT-DESIGNRES-001,
# MSFT-MISSIONCRIT-001, MSFT-RWA-JAVA-001). They were banned from per-finding references and so
# appeared only as Standards Alignment rows with no findings, which rendered as "Not Applicable | —"
# and contradicted the note stating that no status is derived for them. The delivered reports carried
# no such rows. The usage field and its rules are retained so a general-guidance pattern can be added
# back as a single entry if one is ever wanted.

