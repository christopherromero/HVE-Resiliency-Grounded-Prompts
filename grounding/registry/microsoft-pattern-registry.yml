#   NOTE: repository-delivery-resiliency.md redefines BUILD-001, BUILD-002 and
#   CICD-001 through CICD-004 that already exist in container-build-resiliency.md
#   and cicd-pipeline-resiliency.md. Three of those collisions carry DIFFERENT
#   requirements under the same ID. This registry resolves each ID to the granular
#   domain standard. The grounding collision itself still needs fixing separately.
# ---------------------------------------------------------------------------
