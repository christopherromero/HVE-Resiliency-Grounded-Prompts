# Resiliency Finding Qualification Policy

## Purpose
Classify every evidence-backed, applicable control violation as either a resiliency finding or a non-resiliency finding without discarding either class.

## Required classification gate
A finding may be classified `resiliency` only when all are established:
1. Repository-owned evidence demonstrates the control violation.
2. A credible failure scenario is stated.
3. The scenario affects an approved resiliency domain.
4. The repository behavior has a causal, material impact on the target architecture or operational recovery objective.
5. The impact is more specific than general quality, security, correctness, performance, compatibility, or maintainability concern.

If evidence supports the violation but one or more resiliency criteria are not met, retain it as `non_resiliency`; do not suppress or discard it.

## Approved resiliency domains
- availability
- recovery
- regional_failover
- fault_tolerance
- dependency_isolation
# - timeout_management
- retry_management
- traffic_eligibility
- workload_ownership
- state_recovery
- durability
- recoverability
- failure_observability
- overload_protection
- graceful_termination

## Finding output contract
```yaml
finding_classification:
  type: resiliency | non_resiliency
  qualification_status: qualified | not_qualified
  policy_id: RESILIENCY-FINDING-QUALIFICATION
  policy_version: "1.1.0"
  resiliency_domains: []
  failure_scenario: required_for_resiliency_or_not_applicable
  target_architecture_element: required_for_resiliency_or_not_applicable
  causal_mechanism: required_for_resiliency_or_not_applicable
  material_impact: required_for_resiliency_or_not_applicable
  non_resiliency_category: security | correctness | performance | compatibility | contract | maintainability | modernization | assessment_quality | other | not_applicable
  classification_rationale: required
```

## Report ordering
- Preserve both finding classes.
- Render Resiliency-Focused Recommendations first, grouped P0, P1, P2, P3.
- Render Non-Resiliency-Focused Recommendations second, grouped P2, P3 only.
- Priority is assigned by Step 3A to both classes through the approved priority policy.
- Counts, matrix rows, roadmap mappings, and Appendix A traceability include both classes.
- Never intermix classes within one recommendation section.

## Testing controls
A missing-test finding inherits the classification of the specific failure behavior it leaves unverified. Generic test absence without an identified applicable failure scenario is non-resiliency.

## Separation from business-logic risk
Finding classification identifies impact type. Business-logic risk governs implementation approval. Neither field overrides the other.

qualification_exclusions:

  scheduled_runs:
    default_classification: non_resiliency

  telemetry_improvements:
    default_classification: non_resiliency

  observability_only:
    default_classification: non_resiliency

    exception:
      qualifies_as_resiliency_when:
        - cannot_detect_service_failure
        - cannot_verify_recovery
        - blocks_failover_verification
        - blocks_incident_recovery

logging_only_fixes:

  default_classification: non_resiliency

  rules:
    - Logging-only changes are not resiliency findings.
    - Logging-only changes cannot be P0.
    - Logging-only changes cannot be P1.

  exception:
    qualifies_as_resiliency_when:
      - logging_absence_prevents_detection_of_failure
      - logging_absence_prevents_recovery_validation
      - logging_absence_blocks_failover_verification
      - logging_absence_blocks_incident_recovery

