schema_version: "1.0.0"
policy_id: KAFKA-OPERATING-SCENARIO
lifecycle_status: active
purpose: Select the Confluent Kafka application operating scenario from authoritative persistence responsibility.
precedence:
  - active_standby
  - independent_regional_active_active
rules:
  - rule_id: KAFKA-SCENARIO-001
    description: Azure SQL authoritative state requires Kafka active-standby.
    when:
      azure_sql.used_by_production_code: true
      azure_sql.role_in:
        - authoritative_business_state
        - transactional_system_of_record
    select: active_standby
  - rule_id: KAFKA-SCENARIO-002
    description: Cosmos-only MongoDB RU multi-write applications use independent regional active-active Kafka.
    when:
      azure_sql.used_by_production_code: false
      cosmos_db.used_by_production_code: true
      cosmos_db.api: mongodb
      cosmos_db.throughput_model: ru
      cosmos_db.role_in:
        - authoritative_business_state
        - durable_operational_state
      cosmos_db.multi_region_writes: true
    select: independent_regional_active_active
  - rule_id: KAFKA-SCENARIO-003
    description: Incomplete or conflicting evidence cannot select a scenario.
    otherwise:
      select: unresolved
      assessment_status: not_assessed
required_evidence:
  - effective production use, not dependency presence alone
  - authoritative persistence role
  - Cosmos DB API and RU throughput model when applicable
  - Cosmos DB multi-region-write state when applicable
  - Kafka independent-cluster or active-standby architecture context
quality_rules:
  - Azure SQL authoritative-state presence always wins over Cosmos DB.
  - Cosmos used only as a failure queue or cache does not select active-active.
  - Do not infer deployed topology from repository absence.
