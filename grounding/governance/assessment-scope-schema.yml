---
schema_version: "1.1.0"
document_type: assessment_scope_schema
schema_id: ASSESSMENT-SCOPE-CONTEXT
lifecycle_status: active
owner: Cloud Architecture Team
---
allowed_domains:
  application_code: [enabled, disabled]
  application_configuration: [enabled, disabled]
  container_build: [enabled, disabled]
  cicd_pipeline: [enabled, disabled]
  deployment_configuration: [enabled, disabled]
  frontend_application: [enabled, inventory_only, disabled]
  infrastructure_as_code: [disabled, inventory_only, findings_enabled]
  deployed_infrastructure: [disabled]
defaults:
  application_code: enabled
  application_configuration: enabled
  container_build: disabled
  cicd_pipeline: disabled
  deployment_configuration: disabled
  frontend_application: disabled
  infrastructure_as_code: disabled
  deployed_infrastructure: disabled
frontend_application_domain:
  purpose: Gates assessment of repository-owned browser client and server-rendering
    workloads.
  standards:
  - FRONTEND-WEB-CLIENT
  - ANGULAR-RXJS
  - REACT-UI
  - FRONTEND-SSR-SERVER
  rules:
  - disabled_makes_all_frontend_controls_not_applicable
  - inventory_only_permits_inventory_and_evidence_without_findings
  - framework_standards_require_frontend_web_client_baseline
  - ssr_standard_requires_positive_ssr_detection
  - absent_ssr_evidence_makes_ssr_controls_not_applicable
  - frontend_findings_use_same_priority_governance_as_backend_findings
allowed_testing_output_modes:
  - full
  - summary
  - roadmap_only
  - hidden

testing_output_schema:

  mode:
    required: true
    allowed_values:
      - full
      - summary
      - roadmap_only
      - hidden

  show_test_findings:
    type: boolean

  show_test_code:
    type: boolean

  show_validation_commands:
    type: boolean

  show_acceptance_criteria:
    type: boolean

  show_validation_evidence:
    type: boolean

  include_consolidated_validation_strategy:
    type: boolean

report_finding_selection:
  allowed_modes:
    - all_priorities
    - priority_filter
  allowed_priorities:
    - P0
    - P1
    - P2
    - P3
  defaults:
    mode: all_priorities
    include_priorities:
      - P0
      - P1
    include_conditional_findings: true
    include_verified_controls: true
    include_evidence_gaps: true
  validation_rules:
    - include_priorities_must_not_be_empty_for_priority_filter
    - include_priorities_must_be_unique
    - include_priorities_must_use_allowed_values
    - selection_must_not_change_step_2_findings
    - selection_must_not_change_step_3a_priorities
    - filtered_report_must_declare_omitted_priorities
    - filtered_counts_must_reconcile_to_selected_priorities
    - authoritative_total_counts_must_remain_available_in_source_artifacts
finding_classification_output:
  include_resiliency_findings: {type: boolean, default: true}
  include_non_resiliency_findings: {type: boolean, default: true}
  report_section_order: {required_value: [resiliency, non_resiliency]}
  priority_order_within_each_class: {required_value: [P0, P1, P2, P3]}

shared_service_scope_boundary:
  schema_path: grounding/governance/shared-service-assessment-scope-schema.yml
  context_path: architecture_context.shared_service_assessment_scope
  separate_from_artifact_domain_scope: true
  separate_from_repository_exclusions: true

external_configuration_sources_schema:
  policy_path: grounding/governance/external-configuration-resolution-policy.yml
  context_key: external_configuration_sources
  type: list
  default: []
  item:
    source_id: {required: true, pattern: "^CFG-SRC-[0-9]{3}$"}
    type: {required: true, allowed_values: [spring_cloud_config_server]}
    activation_mode:
      required: false
      default: detected_config_client
      allowed_values: [detected_config_client, customer_declared_mirror]
    detected_via: {required_when: "activation_mode == detected_config_client"}
    declaration:
      owner: {required_when: "activation_mode == customer_declared_mirror"}
      reference: {required_when: "activation_mode == customer_declared_mirror"}
    application_name: {required: true}
    profiles: {required: true, type: list}
    label: {required: false}
    server_availability: {required: true, allowed_values: [available, unavailable]}
    local_equivalent:
      status: {required: true, allowed_values: [present, none]}
      authority: {required_when: "status == present", allowed_values: [authoritative]}
      root_path: {required_when: "status == present"}
      files: {required_when: "status == present", type: list}
      provenance:
        origin: {required_when: "status == present"}
        captured_on: {required: false}
        source_revision: {required: false}
      fingerprint:
        algorithm: {required_when: "status == present", allowed_values: [sha256]}
        scope: {required_when: "status == present", allowed_values: [concatenated_listed_files_in_order]}
        value: {required_when: "status == present", pattern: "^(compute_at_inventory|[A-Fa-f0-9]{64})$"}
  validation_rules:
    - source_ids_must_be_unique
    - omitted_activation_mode_uses_detected_config_client
    - customer_declared_mirror_requires_present_local_equivalent_and_nonplaceholder_owner_reference_and_origin
    - absent_config_client_does_not_invalidate_customer_declared_mirror
    - contradictory_application_profile_or_label_binding_blocks_affected_source
    - local_equivalent_file_list_must_be_nonempty_and_unique
    - local_equivalent_paths_must_resolve_inside_workspace_and_declared_root
    - local_equivalent_files_must_exist_under_root_path
    - local_equivalent_files_must_be_readable_valid_configuration_documents
    - compute_at_inventory_captures_sha256_without_expected_hash_comparison
    - supplied_sha256_must_match_computed_value_of_listed_files
    - fingerprint_uses_raw_bytes_in_listed_order_without_normalization
    - missing_or_invalid_fingerprint_remains_unresolved
    - mirror_root_path_is_in_assessment_boundary_when_status_present
    - failed_validation_sets_affected_key_provenance_unresolved
