name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  SERVICE_NAME: inventory-service
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test
        run: mvn --batch-mode clean verify

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign in to ACR
        run: az acr login --name "${{ secrets.ACR_NAME }}"
      - name: Build and push image
        run: |
          docker build --tag "${{ secrets.ACR_LOGIN_SERVER }}/${SERVICE_NAME}:${IMAGE_TAG}" .
          docker push "${{ secrets.ACR_LOGIN_SERVER }}/${SERVICE_NAME}:${IMAGE_TAG}"
      - name: Get AKS credentials
        run: >-
          az aks get-credentials
          --resource-group "${{ secrets.AKS_RESOURCE_GROUP }}"
          --name "${{ secrets.AKS_CLUSTER_NAME }}"
          --overwrite-existing
      - name: Deploy manifests
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_KEYVAULT_NAME: ${{ secrets.AZURE_KEYVAULT_NAME }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
        run: |
          envsubst < k8s/secretproviderclass.yaml | kubectl apply -f -
          envsubst < k8s/service.yaml | kubectl apply -f -
          envsubst < k8s/deployment.yaml | kubectl apply -f -
          envsubst < k8s/hpa.yaml | kubectl apply -f -
          kubectl rollout status deployment/${SERVICE_NAME} --namespace ecommerce --timeout=180s