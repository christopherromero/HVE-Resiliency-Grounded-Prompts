apiVersion: apps/v1
kind: Deployment
metadata: { name: inventory-service, namespace: ecommerce }
spec:
  replicas: 2
  selector: { matchLabels: { app: inventory-service } }
  template:
    metadata:
      labels: { app: inventory-service, azure.workload.identity/use: "true" }
    spec:
      serviceAccountName: ecommerce-workload-identity
      containers:
        - name: inventory-service
          image: ${ACR_LOGIN_SERVER}/inventory-service:${IMAGE_TAG}
          ports: [{ name: http, containerPort: 8082 }]
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: prod }
            - { name: AZURE_KEYVAULT_ENDPOINT, value: "https://${AZURE_KEYVAULT_NAME}.vault.azure.net/" }
            - { name: KAFKA_BOOTSTRAP_SERVERS, value: "${KAFKA_BOOTSTRAP_SERVERS}" }
            - name: SQL_CONNECTION_STRING
              valueFrom: { secretKeyRef: { name: inventory-service-secrets, key: sql-connection-string } }
            - name: REDIS_CONNECTION_STRING
              valueFrom: { secretKeyRef: { name: inventory-service-secrets, key: redis-connection-string } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: http }, initialDelaySeconds: 20, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: http }, initialDelaySeconds: 45, periodSeconds: 20 }
          volumeMounts: [{ name: secrets-store, mountPath: /mnt/secrets-store, readOnly: true }]
      volumes:
        - name: secrets-store
          csi: { driver: secrets-store.csi.k8s.io, readOnly: true, volumeAttributes: { secretProviderClass: inventory-service-secrets } }