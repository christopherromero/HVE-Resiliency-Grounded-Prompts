  - order: 1
    name: Azure Shared Service
    source_field: azure_shared_service
  - order: 2
    name: Architecture Title
    source_field: architecture_title
  - order: 3
    name: Reference
    source_field: reference_url
    render_as: markdown_link
    link_text: Reference
  - order: 4
    name: Approval Status
    source_field: approval_status
  - order: 5
    name: Version
    source_field: document_version
  selection:
    mode: applicable_or_all
    applicable_or_all_behavior: Render entries whose applicable_when matches a Step 1 confirmed dependency or capability.
      When no entry matches, render every entry with lifecycle_status approved.
    sort_by: azure_shared_service
  authorization:
    links_are_pre_approved: true
    exempt_from_invented_link_exclusion: true
    rationale: These URLs are supplied by an approved registry and are not invented by the report generator.
  no_registry_statement: No customer-specific reference-architecture registry was supplied. The assessment uses the grounded
    application behavior standards and cited Microsoft patterns.
  no_registry_statement_applies_when: REFERENCE_ARCHITECTURE_REGISTRY is not supplied, unreadable, or has lifecycle_status
    other than approved.
governance_rules:
- This registry is the only authoritative source for customer-specific reference-architecture links.
- The report schema must define column structure only and must not embed customer URLs.
- Do not invent, infer, or substitute a reference URL that is absent from this registry.
- Do not render an entry whose lifecycle_status is retired.
- Render document_status so a draft or proposal document is not presented as a final approved design.
- A reference architecture describes intended design. It is not evidence that infrastructure is deployed or configured correctly.
- Reference links must never be used as repository source evidence for a finding.
