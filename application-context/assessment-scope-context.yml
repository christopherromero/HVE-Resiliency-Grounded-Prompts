---
schema_version: "1.1.0"
document_type: assessment_scope_context
lifecycle_status: active
context_id: default-assessment-scope
context_version: "1.1.0"
owner: Cloud Architecture Team
---
assessment_scope:
  application_code: {status: enabled}
  application_configuration: {status: enabled}
  container_build: {status: disabled}
  cicd_pipeline: {status: disabled}
  deployment_configuration: {status: enabled}
  frontend_application: {status: disabled}
  infrastructure_as_code: {status: disabled}
  deployed_infrastructure: {status: disabled}
scope_rules:
  repository_owned_only: true
  externally_owned_assets: evidence_gap_only
  missing_context_behavior: use_governed_defaults
  unknown_ownership_behavior: not_assessed
  deployed_infrastructure_findings_allowed: false
  pcf_findings_allowed: false
# Schema: grounding/governance/assessment-scope-schema.yml#external_configuration_sources_schema
external_configuration_sources:
  - source_id: CFG-SRC-001
    type: spring_cloud_config_server
    activation_mode: customer_declared_mirror
    declaration:
      owner: "customer configuration owner"
      reference: "evidence-handoff reference"
    application_name: cart-service
    profiles: [prod]
    label: main
    server_availability: unavailable
    local_equivalent:
      status: present
      authority: authoritative
      root_path: application-context/config-mirrors/cart-service
      files: [application.yml, application-prod.yml]
      provenance:
        origin: "configserver/cart-service"
        captured_on: "2026-06-01"
      fingerprint:
        algorithm: sha256
        scope: concatenated_listed_files_in_order
        value: compute_at_inventory
report_preferences:
  finding_selection:
    mode: all_priorities
    include_priorities:
      - P0
      - P1
      - P2
      - P3
    include_conditional_findings: true
    include_verified_controls: false
    include_evidence_gaps: true
    excluded_priority_behavior: omit_from_filtered_report
  testing_output:
    mode: hidden
    show_test_findings: true
    show_test_code: false
    show_validation_commands: false
    show_acceptance_criteria: false
    show_validation_evidence: false
    include_consolidated_validation_strategy: false

  finding_classification_output:
    include_resiliency_findings: true
    include_non_resiliency_findings: true
    report_section_order: [resiliency, non_resiliency]
    priority_order_within_each_class: [P0, P1, P2, P3]
    non_resiliency_allowed_priorities: [P2, P3]
