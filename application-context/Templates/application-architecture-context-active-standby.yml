---
schema_version: "1.0.0"
document_type: application_architecture_context
lifecycle_status: approved
---

# Update the <....> values to match your application and architecture context

architecture_context:
  context_id: "<application-name>-active-standby-architecture"
  context_version: "1.0.0"
  lifecycle_status: approved
  context_owner: "<application-or-solution-architecture-team>"
  approved_by: "<approver-name-or-group>"
  approved_at: "<YYYY-MM-DD>"
  application_name: "<application-name>"
  repository_name: "<repository-name>"

  deployment_model:
    scenario: active_standby
    primary_region: "<primary-region>"
    standby_region: "<standby-region>"
    both_regions_serve_authoritative_work: false
    same_application_artifact: true


#Update the ingress_path components to match your application's ingress architecture. If you have a different architecture, you can modify the components accordingly.

  ingress_path:
    source: supplied_architecture_context
    components:
      - sequence: 1
        role: external_or_internal_global_load_balancer
        implementation: "Akamai|F5|other|not_provided"
        required: false
      - sequence: 2
        role: regional_ingress
        implementation: "Azure Application Gateway|other|not_provided"
        required: true
      - sequence: 3
        role: api_gateway
        implementation: "Azure API Management|other|not_provided"
        required: false
      - sequence: 4
        role: application
        implementation: "<application-name>"
        required: true

  authoritative_state:
    - dependency: azure_sql
      service_model: azure_sql_database
      role: authoritative_business_state
      operating_model: active_standby
      connection_contract: failover_group_read_write_listener
      primary_role_verification_required: true

# Update the supporting_state components to match your application's supporting state architecture. If you have a different architecture, you can modify the components accordingly.

  supporting_state:
    - dependency: cosmos_db
      used_by_production_code: "true|false"
      api: "mongodb|nosql|not_applicable"
      throughput_model: "ru|vcore|not_applicable"
      role: "failure_queue|cache|durable_operational_state|optional|not_applicable"
      operating_model: "multi_region_write|supporting|not_applicable"
      selects_kafka_active_active: false

  kafka_operating_model:
    scenario: active_standby
    architecture_status: approved
    scenario_policy_id: KAFKA-OPERATING-SCENARIO
    expected_scenario_rule_id: KAFKA-SCENARIO-001

    cluster_model:
      type: primary_and_standby_clusters
      stretched_cluster: false
      cluster_per_region: true

    processing_ownership:
      type: single_active
      aligned_dependency: azure_sql_primary
      ownership_epoch_required: true
      stale_active_fencing_required: true

    regional_roles:
      primary_region: active
      standby_region: standby

    client_behavior:
      normal_cluster_affinity: active_cluster_only
      cross_region_bootstrap_fallback: prohibited
      silent_client_failover_to_standby: prohibited
      same_application_artifact: true
      endpoints_deployment_injected: true

    active_role_behavior:
      producers_enabled: true
      consumers_enabled: true
      schedulers_enabled: true
      reprocessors_enabled: true
      authoritative_sql_writes_enabled: true

    standby_role_behavior:
      producers_enabled: false
      consumers_enabled: false
      schedulers_enabled: false
      reprocessors_enabled: false
      authoritative_sql_writes_enabled: false
      readiness_represents_activation_eligibility: true
      intentional_inactivity_is_not_failure: true

#update the replication_contract and failover_contract components to match your application's replication and failover architecture. If you have a different architecture, you can modify the components accordingly.

    replication_contract:
      cluster_linking_expected: "true|external_evidence_required"
      topic_replication_expected: true
      consumer_offset_replication_expected: true
      schema_replication_expected: true
      acl_replication_expected: "true|architecture_specific"
      mirror_topics_read_only_before_promotion: true

    failover_contract:
      ordered_steps:
        - detect_and_validate_regional_failure
        - fence_old_active_producers_consumers_and_schedulers
        - complete_or_initiate_azure_sql_failover
        - verify_sql_read_write_listener_reaches_current_primary
        - verify_kafka_replicated_state_and_offsets
        - promote_or_activate_standby_kafka_role
        - update_ownership_epoch
        - activate_standby_application_processing
        - validate_processing_and_backlog
        - enable_or_route_workload_traffic
      old_active_fencing_required: true
      sql_primary_verification_required: true
      kafka_promotion_verification_required: true
      offset_readiness_verification_required: true
      ownership_epoch_required: true
      manual_or_automated_procedure: "<manual|automated|hybrid>" #update this value to match your architecture's failover procedure

    failback_contract:
      defined: true
      current_active_fenced_before_reversal: true
      replicated_state_verified_before_reversal: true
      offset_readiness_verified: true
      ownership_epoch_advanced: true
      duplicate_replay_protected: true

    identity_contract:
      stable_event_identity_across_clusters: true
      stable_business_operation_identity: true
      database_uniqueness_or_deduplication_required: true
      regenerated_identity_during_failover: prohibited

    required_validation:
      - azure_sql_primary_loss
      - kafka_active_cluster_loss
      - sql_role_changes_before_kafka_role
      - kafka_role_changes_before_sql_role
      - old_active_partially_reachable
      - duplicate_records_after_offset_restore
      - standby_starts_with_stale_configuration
      - both_regions_active_conflict
      - both_regions_inactive_gap
      - failback_role_reversal

# Update the related_processing_chains components to match your application's processing chains. If you have a different architecture, you can modify the components accordingly.
  related_processing_chains:
    - chain_id: CHAIN-001
      architecture_status: approved
      description: "Active Kafka processing aligned with Azure SQL primary ownership"
      path:
        - component: "<application-name>"
          role: active_kafka_producer_or_consumer
        - component: "<active-kafka-topic>"
          role: event_stream
        - component: "<application-or-downstream-processor>"
          role: event_processor
        - component: azure_sql
          role: authoritative_business_state

#Update the direct_dependency_expectations components to match your application's dependencies. If you have a different architecture, you can modify the components accordingly.
  direct_dependency_expectations:
    azure_sql:
      expected: true
      role: authoritative_business_state
    cosmos_db:
      expected: "true|false"
      role: "failure_queue|cache|durable_operational_state|optional|not_applicable"
    confluent_kafka:
      expected: true
      role: active_standby_event_transport

#Update the eveidence references to match your architecture documentation or decision records.

  architecture_evidence:
    - reference_id: "ARCH-KAFKA-AS-001"
      description: "Approved Kafka active-standby architecture"
      source: "<architecture-document-or-decision-record>"
    - reference_id: "ARCH-SQL-AS-001"
      description: "Approved Azure SQL failover-group architecture"
      source: "<architecture-document-or-decision-record>"

  validation_expectations:
    repository_must_be_compatible_with_declared_scenario: true
    scenario_policy_validation_required: true
    repository_conflict_routes_to: architecture_governance_review
    infrastructure_deployment_validation_in_code_assessment: false
