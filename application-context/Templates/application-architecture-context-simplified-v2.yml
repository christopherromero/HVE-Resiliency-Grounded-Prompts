---
schema_version: "2.0.0"
document_type: application_architecture_context
lifecycle_status: template
---

architecture_context:

  metadata:
    application_name: "<application-name>"
    repository_name: "<repository-name>"
    business_role: "<primary-business-function>"

    context_owner: "<architecture-owner-or-team>"
    approved_by: "<approver>"
    approved_at: "<YYYY-MM-DD>"

    lifecycle_status: "<draft|approved>"
    version: "1.0.0"

  deployment_model:

    operating_model: "<active_active|active_standby>"

    regions:
      - "<primary-region>"
      - "<secondary-region>"

    same_application_artifact_across_regions: true

  authoritative_state:

    dependency: "<azure_sql|cosmos_db|cassandra|none>"

    role: "<authoritative_business_state|supporting_state|none>"

    operating_model: "<active_standby|multi_region_write|regional_independent|none>"

  kafka_operating_model:

    scenario: "<active_standby|independent_regional_active_active|database_independent_kafka>"

    scenario_policy_id: "KAFKA-OPERATING-SCENARIO"

    expected_scenario_rule_id: "<KAFKA-SCENARIO-001|KAFKA-SCENARIO-002|KAFKA-SCENARIO-003>"

    cluster_model: "<primary_and_standby_clusters|independent_regional_clusters>"

    regional_processing_model: "<single_active|multi_active>"

    stretched_cluster: false

  upstream_dependencies:

    - service: "<upstream-service>"

      interaction: "<kafka|rest|grpc|event_grid|event_hub|other>"

      role: "<business_event_source|request_source|data_source|other>"

  downstream_dependencies:

    - service: "<downstream-service>"

      interaction: "<kafka|rest|grpc|event_grid|event_hub|other>"

      role: "<external_side_effect|event_consumer|dependent_service|other>"

  external_side_effects:

    present: false

    types: []

    # Examples:
    # email_delivery
    # sms_delivery
    # payment_processing
    # partner_api_call
    # inventory_update

  direct_dependency_expectations:

    kafka: false

    azure_sql: false

    cosmos_db: false

    redis: false

    key_vault: false

  architecture_decisions:

    - decision_id: "ADR-001"

      title: "<decision-title>"

      status: "<approved|proposed>"

  architecture_evidence:

    - reference_id: "ARCH-001"

      description: "<architecture-reference>"

      source: "<document-location>"

  assessment_guidance:

    application_context_is_primary_architecture_authority: true

    solution_context_required: false

    repository_evidence_must_validate_implementation: true

    conflicts_route_to_architecture_review: true
