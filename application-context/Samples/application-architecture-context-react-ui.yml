---
schema_version: "3.1.0"
document_type: application_architecture_context
lifecycle_status: draft
---
# Enable frontend_application in assessment-scope-context.yml before assessing UI controls.
# Paths, symbols, versions, and deployment descriptions below are illustrative, not source evidence.
architecture_context:
  metadata:
    application_name: Ecommerce Platform
    repository_name: sample-item-display-ui
    business_role: Partner portal item display and maintenance
    context_owner: Ecommerce
    approved_by: requires_approval
    approved_at: requires_approval
    lifecycle_status: draft
    version: "3.1.0"
    sample_only: true
    source_state_is_illustrative: true
    description: >-
      Illustrative client-side-rendered React 18 Module Federation remote
      (apps/item-display-ui, federation name item-display-ui, exposes ./Module and
      ./RemoteStates) served under /item-display by a minimal Node.js 18 Express
      static server (apps/item-display-ui-static-server) on AKS. The static server
      serves assets, /health, /.build-info, and /api/remote-configs using endpoint
      URLs supplied through environment variables. It performs no authentication,
      holds no sessions, and calls no backend. A portal-ui-shell host supplies
      window.portalShellMfePaths, window.PortalTokenManager, and window.userDetails.
      The browser loads the item host RemoteStates and a shared UI remote at
      runtime and calls the item GraphQL API directly through RTK Query. This
      example owns no database, cache, Key Vault, or Kafka integration. Replace
      illustrative metadata, paths, runtime versions, and source-state assumptions
      with repository-validated values. Confirm requires_confirmation items and
      obtain architecture approval before setting both lifecycle statuses to
      approved and target lifecycle statuses to approved_target.

  runtime_expectations:
    contract_version: "1.0.0"
    canonical_key_source: dependency_standard_registry
    # Node.js is the illustrative server runtime; JVM controls do not apply.
    # Record the missing Node.js runtime standard as a dependency_standard_gap.
    runtimes:
      jvm-runtime:
        expected_status: not_expected
        production_use_expected: false
        assessment_scope: [build_configuration, application_lifecycle, runtime_tests]
        source:
          lifecycle_status: current
          runtime_family: jvm
          runtime_version: unknown
          execution_platform: aks
          containerized: true
        target:
          lifecycle_status: proposed_target
          runtime_family: jvm
          minimum_runtime_version: unknown
          execution_platform: aks
          containerized: true
          required_capabilities:
            container_awareness: required
            bounded_heap_strategy: required
            graceful_shutdown: required
            readiness_withdrawal: required
            runtime_observability: required
        grounding:
          standard_id: JVM-RUNTIME-RESILIENCY
          registry_id: jvm-runtime
          path: grounding/dependencies/jvm-runtime-resiliency.md
          version: "1.1.0"

  deployment_evolution:
    source:
      state_label: illustrative_current_baseline
      lifecycle_status: current
      operating_model: active_standby
      traffic_model: single_active
      primary_region: westus
      disaster_recovery_region: eastus
      regions:
        - {region: westus, role: primary, processing_state: active}
        - {region: eastus, role: disaster_recovery, processing_state: standby}
      same_application_artifact_across_regions: true
      description: >-
        Illustrative baseline with an active West US region and an East US standby.
        requires_confirmation: validate the actual production regions and standby
        arrangement with the application and platform owners. Repository-owned
        deployment workflows may describe intent but do not prove deployed state.
    target:
      state_label: proposed_target_deployment
      lifecycle_status: proposed_target
      operating_model: active_active
      traffic_model: multi_active
      regions:
        - {region: westus2, role: active, processing_state: active}
        - {region: westus, role: active, processing_state: active}
      same_application_artifact_across_regions: true
      description: >-
        The illustrative target runs the same image actively in West US 2 and
        West US. Readiness concerns include region-consistent /api/remote-configs
        values, Module Federation remoteEntry.js availability for the shell, item
        host, and shared UI remotes, and item-lock and workflow mutation behavior
        when a request is retried or routed to another region. This is a proposed
        design, not an approval or a statement of deployed infrastructure.
    transition:
      transition_type: source_to_target
      source_to_target_assessment: true
      assessment_focus: target_state_code_readiness
      source_state_used_for:
        - current_state_description
        - migration_context
        - existing_behavior_baseline
      target_state_used_for:
        - resiliency_control_applicability
        - gap_assessment
        - remediation_planning
        - implementation_target
        - implementation_review
      target_state_must_not_be_reported_as_current: true
      source_and_target_regions_must_not_be_merged: true
      source_target_difference_is_not_a_finding: true

  architecture_decisions: []

  authoritative_state:
    dependency: none
    role: no_application_database
    source: {lifecycle_status: current, operating_model: not_applicable, database_present: false}
    target: {lifecycle_status: proposed_target, operating_model: not_applicable, database_present: false}
    reporting_rule: >-
      This illustrative UI owns no authoritative business state. Item, draft,
      workflow, distribution, and item-lock state belongs to the item GraphQL API
      and its backing services. Do not treat browser sessionStorage or Redux state
      as authoritative business state.

  supporting_state:
    - state_id: browser-session-storage
      role: per_tab_ui_navigation_and_lock_hints
      selection_evidence:
        - src/hooks/useItemLock.ts (lockedBy, lockTime, lockModalPopup, draftId, lockedRole, isDisplayOpened)
        - src/hooks/useSessionStorageUrl/useSessionStorageUrl.ts (prevUrl, currentUrl, route params, itemIdfromUrl)
        - src/server/Api/*.ts (ITEM_GRAPHQL_ENDPOINT sessionStorage override precedes RemoteConfigsManager endpoint)
        - src/components/ItemForm/CaseManagement/uploads.utils.ts (VENDOR_API_ENDPOINT)
      loss_impact: Per-tab only; lost on tab close. Lock ownership hints may diverge from server-side lock state.
    - state_id: redux-store-and-rtk-query-cache
      role: in_memory_client_cache
      selection_evidence:
        - src/app/store.ts
        - src/server/Api/ItemListApi.ts, itemRefetchApiList.ts, workflow/*.ts (createApi + fetchBaseQuery)
      loss_impact: Rebuilt from the item GraphQL API on reload. Confirm whether persistence middleware is used.

  atlas_global_cluster_contract:
    applicability: not_applicable
    rationale: >-
      MongoDB and Kafka are absent from this illustrative repository, so the Atlas
      Global Cluster and Kafka scenario (KAFKA-SCENARIO-006) does not apply.

  kafka_operating_model:
    scenario_policy_id: KAFKA-OPERATING-SCENARIO
    applicability: not_applicable
    kafka_used_by_repository: false
    source:
      lifecycle_status: current
      scenario: unresolved
      regional_processing_model: unresolved
      cluster_model: {type: unknown, stretched_cluster: false, cluster_per_region: not_applicable}
    target:
      lifecycle_status: proposed_target
      scenario: unresolved
      regional_processing_model: unresolved
      cluster_model: {type: unknown, stretched_cluster: false, cluster_per_region: not_applicable}
    reporting_rule: >-
      No Kafka scenario is selected because this illustrative UI does not use
      Kafka. Kafka scenario controls are not applicable, rather than an unresolved
      integration assessment. Repository Kafka evidence would require architecture
      governance review before changing this declaration.

  shared_service_operating_models:
    contract_version: "1.1.0"
    authoritative_for: shared_service_target_operating_model
    default_assessment_state: target
    allowed_operating_models:
      - active_active
      - active_standby
      - single_region
      - externally_managed
      - not_applicable
      - unresolved
    rules:
      - Source records the current service operating model when known.
      - Target records the intended service operating model and requires approval before authoritative use.
      - A source-target difference is migration context, not a finding by itself.
      - Repository evidence validates application compatibility; it does not prove deployed service topology.
      - Missing or conflicting target models make scenario-specific controls not_assessed and require architecture review.
    services:
      aks-istio:
        dependency_standard_id: aks-istio
        source: {operating_model: unresolved, lifecycle_status: current}
        target: {operating_model: unresolved, lifecycle_status: proposed_target}
      apim:
        dependency_standard_id: apim
        source: {operating_model: unresolved, lifecycle_status: current}
        target: {operating_model: unresolved, lifecycle_status: proposed_target}
      appgateway-glb:
        dependency_standard_id: appgateway-glb
        source: {operating_model: unresolved, lifecycle_status: current}
        target: {operating_model: unresolved, lifecycle_status: proposed_target}
      azure-functions:
        dependency_standard_id: azure-functions
        source: {operating_model: not_applicable, lifecycle_status: current}
        target: {operating_model: not_applicable, lifecycle_status: proposed_target}
      azure-managed-redis:
        dependency_standard_id: azure-managed-redis
        source: {operating_model: not_applicable, lifecycle_status: current}
        target: {operating_model: not_applicable, lifecycle_status: proposed_target}
      azure-sql:
        dependency_standard_id: azure-sql
        source: {operating_model: not_applicable, lifecycle_status: current}
        target: {operating_model: not_applicable, lifecycle_status: proposed_target}
      confluent-kafka:
        dependency_standard_id: confluent-kafka
        source: {operating_model: not_applicable, lifecycle_status: current}
        target: {operating_model: not_applicable, lifecycle_status: proposed_target}
        scenario_source: architecture_context.kafka_operating_model.source
        scenario_target: architecture_context.kafka_operating_model.target
      cosmosdb:
        dependency_standard_id: cosmosdb
        source: {operating_model: not_applicable, lifecycle_status: current}
        target: {operating_model: not_applicable, lifecycle_status: proposed_target}
      dse-cassandra:
        dependency_standard_id: dse-cassandra
        source: {operating_model: not_applicable, lifecycle_status: current}
        target: {operating_model: not_applicable, lifecycle_status: proposed_target}
      eventhubs:
        dependency_standard_id: eventhubs
        source: {operating_model: not_applicable, lifecycle_status: current}
        target: {operating_model: not_applicable, lifecycle_status: proposed_target}
      keyvault:
        dependency_standard_id: keyvault
        source: {operating_model: not_applicable, lifecycle_status: current}
        target: {operating_model: not_applicable, lifecycle_status: proposed_target}
      mongodb:
        dependency_standard_id: mongodb
        source: {operating_model: not_applicable, lifecycle_status: current}
        target: {operating_model: not_applicable, lifecycle_status: proposed_target}
      postgresql:
        dependency_standard_id: postgresql
        source: {operating_model: not_applicable, lifecycle_status: current}
        target: {operating_model: not_applicable, lifecycle_status: proposed_target}
      storage-blob:
        dependency_standard_id: storage-blob
        source: {operating_model: not_applicable, lifecycle_status: current}
        target: {operating_model: not_applicable, lifecycle_status: proposed_target}

  shared_service_connectivity_contracts:
    services:
      confluent-kafka:
        dependency_standard_id: confluent-kafka
        source: {connectivity_model: not_applicable, lifecycle_status: current}
        target: {connectivity_model: not_applicable, lifecycle_status: proposed_target}

  shared_service_assessment_scope:
    contract_version: "1.0.0"
    default_scope: in_scope
    canonical_key_source: dependency_standard_registry
    rules:
      - Scope is separate from dependency presence, operating model, and connectivity model.
      - Every used service remains inventoried and available for architecture reasoning.
      - Only in_scope services may produce control results, findings, priorities, remediation, or implementation work.
      - Repository evidence cannot silently expand an approved service scope.
      - Scope conflicts route to architecture governance and do not create code findings.
    services:
      aks-istio:
        assessment_scope: in_scope
        rationale: >-
          AKS hosting is illustrative. requires_confirmation: validate platform
          usage, Istio involvement, and ownership of ingress and probe configuration.
        scope_owner: application_architecture
      apim:
        assessment_scope: in_scope
        rationale: >-
          Evaluate application-level interaction only when production use is
          confirmed. Externally supplied endpoint URLs do not establish APIM use.
        scope_owner: application_architecture
      appgateway-glb:
        assessment_scope: in_scope
        rationale: >-
          Evaluate application-level interaction only when production use is
          confirmed. Active-active intent does not prove a specific routing product.
        scope_owner: application_architecture
      azure-functions:
        assessment_scope: in_scope
        rationale: Evaluate only if repository evidence confirms production use.
        scope_owner: application_architecture
      azure-managed-redis:
        assessment_scope: in_scope
        rationale: >-
          Not expected in this example. Unexpected production use requires
          architecture governance review rather than silent suppression.
        scope_owner: application_architecture
      azure-sql:
        assessment_scope: in_scope
        rationale: Evaluate only if repository evidence confirms production use.
        scope_owner: application_architecture
      confluent-kafka:
        assessment_scope: in_scope
        rationale: >-
          Not expected in this example. Unexpected production Kafka evidence
          requires architecture governance review rather than silent suppression.
        scope_owner: application_architecture
      cosmosdb:
        assessment_scope: in_scope
        rationale: Evaluate only if repository evidence confirms production use.
        scope_owner: application_architecture
      dse-cassandra:
        assessment_scope: in_scope
        rationale: Evaluate only if repository evidence confirms production use.
        scope_owner: application_architecture
      eventhubs:
        assessment_scope: in_scope
        rationale: Evaluate only if repository evidence confirms production use.
        scope_owner: application_architecture
      keyvault:
        assessment_scope: in_scope
        rationale: >-
          Not expected in this example; authentication tokens are supplied by the
          shell through window.PortalTokenManager. Unexpected production use
          requires architecture governance review.
        scope_owner: application_architecture
      mongodb:
        assessment_scope: in_scope
        rationale: >-
          Not expected in this example. Unexpected production use requires
          architecture governance review rather than silent suppression.
        scope_owner: application_architecture
      postgresql:
        assessment_scope: in_scope
        rationale: Evaluate only if repository evidence confirms production use.
        scope_owner: application_architecture
      storage-blob:
        assessment_scope: in_scope
        rationale: Evaluate only if repository evidence confirms production use.
        scope_owner: application_architecture
    reporting:
      render_scope_summary: true
      non_in_scope_records_are_findings: false
      non_in_scope_records_receive_priority: false

  allowed_expected_statuses:
    - required
    - optional
    - not_expected
    - unknown
  dependency_expectations:
    azure-managed-redis: not_expected
    azure-sql: not_expected
    confluent-kafka: not_expected
    cosmosdb: not_expected
    dse-cassandra: not_expected
    eventhubs: not_expected
    keyvault: not_expected
    mongodb: not_expected
    postgresql: not_expected
    storage-blob: not_expected
    frontend-web-client: required
    react-ui: required
    angular-rxjs: not_expected
    frontend-ssr-server: not_expected
  platform_capability_expectations:
    jvm-runtime: not_expected
    aks-istio: required
    apim: optional
    appgateway-glb: optional
    azure-functions: not_expected

  upstream_dependencies:
    - service: portal-ui-shell
      interaction: other
      role: request_source
      notes: >-
        Module Federation host that loads this remote's remoteEntry.js and mounts
        ./Module. Supplies window.portalShellMfePaths (ITEM_MFE_PATH,
        SHARED_UI_MFE_PATH), window.PortalTokenManager.getToken('item'), and
        window.userDetails (groups, preferred_username, vendors) for role resolution.
    - service: partner-portal-browser-users
      interaction: rest
      role: request_source
      notes: Merchants, suppliers, and internal users reach /item-display through the shell.

  downstream_dependencies:
    - service: portal-ui-shell-runtime-services
      interaction: other
      role: dependent_service
      notes: >-
        Supplies a bearer token through PortalTokenManager for authorization
        headers. Validate token acquisition failure behavior in the actual
        repository rather than assuming a request is blocked or authenticated.
    - service: item-host-ui-remote
      interaction: other
      role: dependent_service
      notes: >-
        Item host remote loaded from ITEM_MFE_PATH for ./RemoteStates.
        RemoteConfigsManager fetches ${ITEM_MFE_PATH}api/remote-configs.
        requires_confirmation: identify which static server owns this route.
    - service: shared-ui-remote
      interaction: other
      role: dependent_service
      notes: >-
        Shared components loaded from SHARED_UI_MFE_PATH with a local fallback
        component. Validate the actual loading and fallback paths in the repository.
    - service: item-graphql-api
      interaction: rest
      role: dependent_service
      notes: >-
        ITEM_GRAPHQL_ENDPOINT supplies RTK Query queries and mutations for feature
        flags, item and display data, hierarchy, overview, distribution, workflow
        start/progress/draft, item locks, comments, revision requests, and product
        identifier validation.
    - service: communications-document-service
      interaction: rest
      role: dependent_service
      notes: COMMUNICATIONS_DOCUMENT_UPLOAD, _DOWNLOAD, _META, and _DELETE endpoints from /api/remote-configs.
    - service: vendor-helpcenter-attachment-api
      interaction: rest
      role: dependent_service
      notes: >-
        POST ${VENDOR_API_ENDPOINT}/helpcenter/attachment; the illustrative base
        URL is read from sessionStorage.
    - service: item-file-and-image-endpoints
      interaction: rest
      role: other
      notes: >-
        Bulk item upload/download, digital image upload/metadata, hierarchy,
        originator, to-do and item-list downloads, and vendor permission URLs
        published by /api/remote-configs. Direct use requires_confirmation.

  external_side_effects:
    present: true
    types:
      - item_and_display_draft_mutation
      - workflow_state_transition
      - item_lock_release
      - comment_and_revision_submission
      - document_and_attachment_upload
    notes: >-
      The illustrative remote initiates user-driven mutations; the item GraphQL
      API and file services own the resulting state. Confirm actual effects and
      ownership with downstream owners. Duplicate submission, retry, and
      ambiguous-outcome handling in the browser are frontend assessment concerns.

  context_validation:
    dependency_expectation_keys_must_match_shared_service_keys: true
    platform_capability_expectation_keys_must_use_registry_ids: true
    shared_service_keys_must_match_dependency_standard_ids: true
    connectivity_service_keys_must_match_operating_model_service_keys: true
    runtime_expectation_keys_must_use_registry_ids: true
    required_runtime_must_have_runtime_expectation: true
    runtime_keys_must_not_appear_as_shared_service_keys: true
    runtime_operating_model_prohibited: true
    missing_dependency_expectation_status: unknown
    missing_runtime_expectation_status: unknown
    aliases_prohibited: true
    shared_service_scope_keys_must_use_registry_ids: true
    every_modeled_shared_service_must_have_effective_scope: true
    non_in_scope_services_must_remain_architecturally_visible: true
    non_in_scope_services_must_not_generate_findings: true

  assessment_guidance:
    application_context_is_primary_architecture_authority: true
    solution_context_required: false
    repository_evidence_must_validate_implementation: true
    conflicts_route_to_architecture_review: true
    shared_service_operating_model_interpretation:
      authoritative_path: architecture_context.shared_service_operating_models.services
      assess_code_against: target
      do_not_infer_operating_model_from_dependency_grounding_title: true
      do_not_create_findings_from_source_target_delta_alone: true
    shared_service_scope_interpretation:
      authoritative_path: architecture_context.shared_service_assessment_scope.services
      schema_path: grounding/governance/shared-service-assessment-scope-schema.yml
      default_scope: in_scope
      downstream_recalculation_prohibited: true
      non_in_scope_services_remain_architecturally_visible: true
      repository_evidence_cannot_silently_expand_scope: true
    shared_service_contract_interpretation:
      operating_model_path: architecture_context.shared_service_operating_models.services
      connectivity_contract_path: architecture_context.shared_service_connectivity_contracts.services
      assess_code_against: target
      operating_and_connectivity_models_are_distinct: true
    deployment_state_interpretation:
      source_is_current_state: true
      target_is_proposed_future_state: true
      assess_code_against: target
      describe_current_deployment_from: source
      describe_target_deployment_from: target
      do_not_merge_source_and_target_regions: true
      do_not_report_target_as_current: true
      do_not_report_source_as_target: true
      do_not_use_dependency_topology_as_application_topology: true
      do_not_create_findings_from_migration_delta_alone: true
    runtime_expectation_interpretation:
      authoritative_path: architecture_context.runtime_expectations.runtimes
      canonical_key_source: dependency_standard_registry
      assess_code_against: target
      rules:
        - Node.js is the illustrative server runtime; JVM runtime controls do not apply.
        - Confirm runtime and framework versions against the actual repository and supported versions.
        - Record the missing Node.js runtime standard as a dependency_standard_gap.
        - Missing deployed CPU or memory limits are evidence gaps unless repository-owned manifests are in scope.
        - A source-target runtime difference is not a finding by itself.

  resiliency_assessment_context:
    qualification_policy:
      policy_id: RESILIENCY-FINDING-QUALIFICATION
      version: "1.1.0"
      path: grounding/governance/resiliency-finding-qualification-policy.yml
    preserve_finding_classes: [resiliency, non_resiliency]
    report_section_order: [resiliency, non_resiliency]
    priority_order_within_each_class:
      resiliency: [P0, P1, P2, P3]
      non_resiliency: [P2, P3]
    qualifying_architecture_paths:
      - architecture_context.deployment_evolution.target
      - architecture_context.authoritative_state.target
      - architecture_context.kafka_operating_model.target
      - architecture_context.shared_service_operating_models.services
      - architecture_context.shared_service_connectivity_contracts.services
      - architecture_context.shared_service_assessment_scope.services
      - architecture_context.runtime_expectations.runtimes
    finding_rules:
      repository_evidence_required: true
      control_violation_required: true
      resiliency_impact_chain_required_for_resiliency_class: true
      non_resiliency_findings_retained: true
      source_target_difference_is_not_a_finding: true

  reporting_contract:
    required_fields:
      current_deployment:
        source: architecture_context.deployment_evolution.source
        label: Illustrative current deployment
      proposed_target_deployment:
        source: architecture_context.deployment_evolution.target
        label: Proposed target deployment
      migration_context:
        source: architecture_context.deployment_evolution.transition
        label: Migration context
    prohibited_collapsing:
      - Do not reduce source and target to a single ambiguous Deployment model field.
      - Do not combine West US/East US source regions with West US 2/West US target regions.
      - Do not describe the proposed target as approved or already deployed.

  finding_boundary:
    source_target_difference_is_not_a_finding: true
    finding_requires_repository_evidence: true
    missing_deployed_target_infrastructure_is_evidence_gap: true
    architecture_context_conflict_is_not_a_code_finding: true
    infrastructure_findings_allowed: false
